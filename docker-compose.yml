services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reachinbox
      MYSQL_USER: reachinbox
      MYSQL_PASSWORD: reachinbox
    ports: ["3307:3306"]
    volumes: ["reachinbox-mysql:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["reachinbox-redis:/data"]
volumes:
  reachinbox-mysql:
  reachinbox-redis:
